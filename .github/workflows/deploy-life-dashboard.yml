name: Deploy Life Dashboard to GitHub Pages

on:
  push:
    branches: [main, cursor/life-fitness-dashboard-be23]
    paths:
      - 'life-dashboard/**'
      - '.github/workflows/deploy-life-dashboard.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: life-dashboard/package-lock.json
      - run: npm ci
        working-directory: life-dashboard
      - run: npm run build
        working-directory: life-dashboard
      - uses: actions/upload-pages-artifact@v3
        with:
          path: life-dashboard/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
